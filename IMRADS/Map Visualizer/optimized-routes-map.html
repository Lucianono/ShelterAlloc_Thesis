  .leg-line {
    width: 30px; height: 3px;
    border-radius: 2px;
    flex-shrink: 0;
    position: relative;
  }
  .leg-line::after {
    content: '➤';
    position: absolute;
    right: -10px; top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    line-height: 1;
  }

  .leg-label { color: #333; }
  .leg-divider {
    margin: 8px 0;
    border: none;
    border-top: 1px solid #e0e0e0;
  }
